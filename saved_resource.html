<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>MR PAPRIKA AI PRO 🍕</title>

<style>
body { font-family: Arial; background:#0f172a; color:white; text-align:center; }
h1 { color:#f97316; }

.container { max-width:900px; margin:auto; }

.card {
    background:#1e293b;
    padding:15px;
    margin:15px;
    border-radius:15px;
}

button {
    padding:10px;
    margin:5px;
    border:none;
    background:#f97316;
    color:white;
    cursor:pointer;
}

input {
    padding:10px;
    width:70%;
}

.toast {
    position:fixed;
    bottom:20px;
    right:20px;
    background:black;
    padding:10px;
    border-radius:5px;
}

.admin {
    background:#020617;
    padding:10px;
    margin-top:20px;
}
</style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:#fff}html.dark{background-color:#212121}html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}</style></head>

<body>

<div class="container">

<h1>🍕 MR PAPRIKA AI PRO</h1>

<!-- MENU -->
<div class="card">
<h2>Menu intelligent</h2>
<button onclick="addToCart({name:&#39;Margherita&#39;,price:3000})">Margherita</button>
<button onclick="addToCart({name:&#39;Pepperoni&#39;,price:5000})">Pepperoni</button>
<button onclick="addToCart({name:&#39;Poulet&#39;,price:6000})">Poulet</button>
<button onclick="addToCart({name:&#39;Calzone&#39;,price:7000})">Calzone</button>
</div>

<!-- PANIER -->
<div class="card">
<h2>🛒 Panier</h2>
<ul id="cart-items">
        <li>Poulet - 6000 FCFA 
        <button onclick="removeItem(0)">❌</button></li><p>Total: 6000 FCFA</p></ul>
<button onclick="checkout()">💳 Payer (Mobile Money simulé)</button>
</div>

<!-- IA -->
<div class="card">
<h2>🤖 IA Assistant</h2>
<div id="chat-box" style="height:200px;overflow:auto;"></div>
<input id="chat-input" placeholder="Ex: recommande moi une pizza">
<button onclick="sendMessage()">Envoyer</button>
</div>

<!-- ADMIN -->
<div class="card admin">
<h2>📊 Dashboard Business</h2>
<p id="stats">
    Commandes: 0 <br>
    Revenus: 0 FCFA</p>
</div>

</div>

<script>
// ================= CONFIG =================
const DB = {
    cart: JSON.parse(localStorage.getItem("cart")||"[]"),
    orders: JSON.parse(localStorage.getItem("orders")||"[]"),
    chat: JSON.parse(localStorage.getItem("chat")||"[]")
};

// ================= SAVE =================
function saveAll(){
    localStorage.setItem("cart",JSON.stringify(DB.cart));
    localStorage.setItem("orders",JSON.stringify(DB.orders));
    localStorage.setItem("chat",JSON.stringify(DB.chat));
}

// ================= PANIER =================
function addToCart(item){
    DB.cart.push(item);
    saveAll();
    renderCart();
    showToast("✅ Ajouté");
}

function renderCart(){
    const el=document.getElementById("cart-items");
    el.innerHTML="";

    let total=0;

    DB.cart.forEach((item,i)=>{
        total+=item.price;

        el.innerHTML+=`
        <li>${item.name} - ${item.price} FCFA 
        <button onclick="removeItem(${i})">❌</button></li>`;
    });

    el.innerHTML+=`<p>Total: ${total} FCFA</p>`;
}

function removeItem(i){
    DB.cart.splice(i,1);
    saveAll();
    renderCart();
}

// ================= IA ULTRA =================
function ai(message){

    message = message.toLowerCase();

    const total = DB.cart.reduce((s,i)=>s+i.price,0);

    // IA comportementale
    if(message.includes("recommande")){
        return smartAI();
    }

    if(message.includes("faim")){
        return "😋 Tu devrais prendre une Pepperoni bien chaude !";
    }

    if(message.includes("boisson")){
        return suggestDrink();
    }

    if(message.includes("jus")){
        return suggestJuice();
    }

    if(total > 8000){
        return "🔥 Grosse commande ! Ajoute une boisson ?";
    }

    if(DB.cart.length === 0){
        return "🍕 Commence par une Margherita légère";
    }

    return "🤖 Je peux optimiser ta commande pour toi !";
}

// ================= IA LOGIQUE =================
function smartAI(){

    const history = DB.orders.flat();

    if(history.length > 5){
        return "⭐ Tu es un client fidèle, essaie la Calzone !";
    }

    return ["Margherita","Pepperoni","Poulet","Calzone"]
    [Math.floor(Math.random()*4)];
}

function suggestDrink(){
    return ["🥤 Coca","🥤 Fanta","🥤 Orangina"]
    [Math.floor(Math.random()*3)];
}

function suggestJuice(){
    return ["🧃 Bissap","🧃 Tamarin","🧃 Menthe"]
    [Math.floor(Math.random()*3)];
}

// ================= CHAT =================
function sendMessage(){
    const input=document.getElementById("chat-input");
    const msg=input.value;

    if(!msg)return;

    const res=ai(msg);

    DB.chat.push({user:msg,ai:res});
    saveAll();

    input.value="";
    renderChat();
}

function renderChat(){
    const box=document.getElementById("chat-box");
    box.innerHTML="";

    DB.chat.forEach(c=>{
        box.innerHTML+=`
        <p><b>Vous:</b> ${c.user}</p>
        <p><b>IA:</b> ${c.ai}</p>`;
    });

    box.scrollTop=box.scrollHeight;
}

// ================= PAIEMENT API READY =================
async function checkout(){

    if(!DB.cart.length)return alert("Panier vide");

    showToast("💳 Connexion Mobile Money...");

    // simulation API paiement
    await fakePaymentAPI();

    DB.orders.push([...DB.cart]);
    DB.cart=[];
    saveAll();

    renderCart();
    updateStats();

    showToast("✅ Paiement validé !");
}

// simulation backend paiement réel
function fakePaymentAPI(){
    return new Promise(res=>{
        setTimeout(()=>{
            res(true);
        },2000);
    });
}

// ================= BUSINESS INTELLIGENCE =================
function updateStats(){

    const totalOrders = DB.orders.length;
    const revenue = DB.orders.flat().reduce((s,i)=>s+i.price,0);

    document.getElementById("stats").innerHTML=`
    Commandes: ${totalOrders} <br>
    Revenus: ${revenue} FCFA`;
}

// ================= AUTO MARKETING =================
setInterval(()=>{
    if(DB.cart.length===0){
        showToast("🔥 Promo -10% Pepperoni !");
    }else if(DB.cart.length>=2){
        showToast("🥤 Offre combo boisson !");
    }
},15000);

// ================= UI =================
function showToast(msg){
    const t=document.createElement("div");
    t.className="toast";
    t.innerText=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

// ================= INIT =================
function init(){
    renderCart();
    renderChat();
    updateStats();
}

document.addEventListener("DOMContentLoaded",init);

</script>


</body></html>
