<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><script>
// ================= CONFIG =================
const ADMIN_PASSWORD = "1234";

const STORAGE = {
    OWNER: "mrpaprika_owner",
    ORDERS: "mrpaprika_orders",
    CHAT: "mrpaprika_chat",
    IMAGES: "mrpaprika_images"
};

let isAdmin = false;

// ================= UTILS =================
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const load = (k, d = null) => {
    try { return JSON.parse(localStorage.getItem(k)) || d; }
    catch { return d; }
};

// ================= LOGIN =================
function login() {
    const pass = prompt("Mot de passe admin :");
    if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        alert("Accès admin autorisé 👑");
        document.getElementById("owner-status").innerText = "🔐 Admin connecté";
    } else {
        alert("Accès refusé ❌");
    }
}

function logout() {
    isAdmin = false;
    document.getElementById("owner-status").innerText = "Déconnecté";
}

// ================= OWNER FORM =================
const ownerForm = document.getElementById("owner-form");
ownerForm?.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!isAdmin) { alert("🔐 Accès refusé"); return; }

    const data = {
        name: document.getElementById("owner-name").value,
        email: document.getElementById("owner-email").value,
        phone: document.getElementById("owner-phone").value,
        address: document.getElementById("owner-address").value,
        map: document.getElementById("owner-map").value,
        whatsapp: document.getElementById("owner-whatsapp").value,
        tiktok: document.getElementById("owner-tiktok").value,
        instagram: document.getElementById("owner-instagram").value,
        facebook: document.getElementById("owner-facebook").value
    };

    save(STORAGE.OWNER, data);
    document.getElementById("owner-status").innerText = "✅ Coordonnées sauvegardées";
    renderOwner();
});

// ================= LOAD OWNER =================
function loadOwner() {
    const data = load(STORAGE.OWNER);
    if (!data) return;

    document.getElementById("owner-name").value = data.name || "";
    document.getElementById("owner-email").value = data.email || "";
    document.getElementById("owner-phone").value = data.phone || "";
    document.getElementById("owner-address").value = data.address || "";
    document.getElementById("owner-map").value = data.map || "";
    document.getElementById("owner-whatsapp").value = data.whatsapp || "";
    document.getElementById("owner-tiktok").value = data.tiktok || "";
    document.getElementById("owner-instagram").value = data.instagram || "";
    document.getElementById("owner-facebook").value = data.facebook || "";

    renderOwner();
}

// ================= RENDER OWNER =================
function renderOwner() {
    const data = load(STORAGE.OWNER) || {};
    document.getElementById("owner-status").innerText = isAdmin ? "🔐 Admin connecté" : "";

    // Map / Contact
    document.getElementById("order-notification-count").innerText = data.phone ? `📱 ${data.phone}` : "";
}

// ================= ORDERS =================
function renderOrders() {
    const orders = load(STORAGE.ORDERS, []);
    const list = document.getElementById("order-notifications-list");
    list.innerHTML = "";

    orders.forEach((o, i) => {
        const li = document.createElement("li");
        li.innerText = `Commande ${i+1} : ${o.map(p => p.name).join(", ")}`;
        list.appendChild(li);
    });

    document.getElementById("order-notification-count").innerText =
        orders.length ? `${orders.length} commandes reçues` : "Aucune nouvelle commande";
}

document.getElementById("clear-order-notifications")?.addEventListener("click", () => {
    if (!isAdmin) { alert("🔐 Accès refusé"); return; }
    save(STORAGE.ORDERS, []);
    renderOrders();
});

// ================= CHAT =================
function renderChat() {
    const chats = load(STORAGE.CHAT, []);
    const box = document.getElementById("owner-chat-messages");
    box.innerHTML = "";
    chats.forEach(c => {
        box.innerHTML += `<p><b>Client:</b> ${c.user}</p><p><b>IA:</b> ${c.ai}</p><hr>`;
    });
}

document.getElementById("clear-chat")?.addEventListener("click", () => {
    if (!isAdmin) { alert("🔐 Accès refusé"); return; }
    save(STORAGE.CHAT, []);
    renderChat();
});

// ================= PIZZA IMAGES =================
const pizzaForm = document.getElementById("pizza-images-form");
pizzaForm?.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!isAdmin) { alert("🔐 Accès refusé"); return; }

    const images = {
        margherita: document.getElementById("image-margherita").value,
        pepperoni: document.getElementById("image-pepperoni").value,
        vegetarienne: document.getElementById("image-vegetarienne").value,
        quatre_fromages: document.getElementById("image-quatre-fromages").value
    };

    save(STORAGE.IMAGES, images);
    document.getElementById("pizza-images-status").innerText = "✅ Images mises à jour";
    updateThumbnails(images);
});

document.getElementById("reset-images")?.addEventListener("click", () => {
    if (!isAdmin) { alert("🔐 Accès refusé"); return; }
    localStorage.removeItem(STORAGE.IMAGES);
    location.reload();
});

function updateThumbnails(images) {
    if (!images) images = load(STORAGE.IMAGES);
    if (!images) return;

    if (images.margherita) document.getElementById("thumb-margherita").src = images.margherita;
    if (images.pepperoni) document.getElementById("thumb-pepperoni").src = images.pepperoni;
    if (images.vegetarienne) document.getElementById("thumb-vegetarienne").src = images.vegetarienne;
    if (images.quatre_fromages) document.getElementById("thumb-quatre-fromages").src = images.quatre_fromages;
}

// ================= INIT =================
document.addEventListener("DOMContentLoaded", () => {
    loadOwner();
    renderOrders();
    renderChat();
    const images = load(STORAGE.IMAGES);
    updateThumbnails(images);

    // Ajout bouton login si besoin
    const btn = document.createElement("button");
    btn.innerText = "🔐 Connexion Admin";
    btn.onclick = login;
    document.body.prepend(btn);
});
