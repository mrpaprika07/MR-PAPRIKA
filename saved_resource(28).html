<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>MR PAPRIKA FINAL 🍕</title>

<style>
body { font-family: Arial; background:#020617; color:white; text-align:center; }

.card { background:#0f172a; padding:15px; margin:15px; border-radius:15px; }

.pizza {
    padding:30px;
    margin:10px;
    border-radius:15px;
    background-size:cover;
    background-position:center;
}

.overlay {
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
}

button { padding:8px; margin:5px; background:#f97316; border:none; color:white; }
input { padding:8px; margin:5px; width:80%; }

.hidden { display:none; }

a { color:#38bdf8; display:block; }
</style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:#fff}html.dark{background-color:#212121}html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}</style></head>

<body>

<h1>🍕 MR PAPRIKA FINAL</h1>

<button onclick="login()">🔐 Admin</button>
<button onclick="logout()">🚪 Logout</button>

<!-- CONTACT -->
<div class="card">
<h2>📞 Contact</h2>
<p id="phone"></p>
<p id="location"></p>
<div id="socials"></div>
</div>

<!-- MENU -->
<div class="card">
<h2>Menu</h2>
<div id="menu">
        <div class="pizza" style="background:#333">
            <div class="overlay">
                <h3>Margherita</h3>
                <p>3000 FCFA</p>
                <button onclick="addToCart(0)">Ajouter</button>
                
            </div>
        </div>
        <div class="pizza" style="background:#333">
            <div class="overlay">
                <h3>Pepperoni</h3>
                <p>5000 FCFA</p>
                <button onclick="addToCart(1)">Ajouter</button>
                
            </div>
        </div>
        <div class="pizza" style="background:#333">
            <div class="overlay">
                <h3>Poulet</h3>
                <p>6000 FCFA</p>
                <button onclick="addToCart(2)">Ajouter</button>
                
            </div>
        </div></div>
</div>

<!-- PANIER -->
<div class="card">
<h2>🛒 Panier</h2>
<ul id="cart-items"><p>Total: 0 FCFA</p></ul>
<button onclick="checkout()">💳 Payer</button>
</div>

<!-- IA -->
<div class="card">
<h2>🤖 IA</h2>
<div id="chat-box" style="height:200px;overflow:auto;"></div>
<input id="chat-input">
<button onclick="sendMessage()">Envoyer</button>
</div>

<!-- ADMIN -->
<div id="admin" class="card hidden">

<h2>👑 ADMIN</h2>

<h3>📱 Numéro</h3>
<input id="admin-phone">
<button onclick="savePhone()">Save</button>

<h3>🌍 Localisation</h3>
<input id="admin-location">
<button onclick="saveLocation()">Save</button>

<h3>🔗 Réseaux</h3>
<input id="social-name" placeholder="Nom">
<input id="social-link" placeholder="Lien">
<button onclick="addSocial()">Ajouter</button>

<div id="admin-socials"></div>

<h3>🎨 Background Pizza</h3>
<input id="pizza-id" placeholder="ID">
<input id="pizza-bg" placeholder="Lien image">
<button onclick="changeBg()">Changer</button>

</div>

<script>
// ================= CONFIG =================
const PASSWORD = "1234";

// ================= DB =================
let DB = JSON.parse(localStorage.getItem("DB")) || {
    menu:[
        {name:"Margherita",price:3000,bg:""},
        {name:"Pepperoni",price:5000,bg:""},
        {name:"Poulet",price:6000,bg:""}
    ],
    cart:[],
    chat:[],
    contact:{ phone:"", location:"", socials:[] }
};

let isAdmin=false;

function save(){ localStorage.setItem("DB",JSON.stringify(DB)); }

// ================= LOGIN =================
function login(){
    const p=prompt("Mot de passe:");
    if(p===PASSWORD){
        isAdmin=true;
        document.getElementById("admin").classList.remove("hidden");
        renderMenu();
    } else alert("Refusé");
}

function logout(){
    isAdmin=false;
    document.getElementById("admin").classList.add("hidden");
    renderMenu();
}

function protect(){
    if(!isAdmin){ alert("🔐 Accès refusé"); return false; }
    return true;
}

// ================= MENU =================
function renderMenu(){
    const el=document.getElementById("menu");
    el.innerHTML="";

    DB.menu.forEach((p,i)=>{

        const bg = p.bg ? `background-image:url('${p.bg}')` : "background:#333";

        el.innerHTML+=`
        <div class="pizza" style="${bg}">
            <div class="overlay">
                <h3>${p.name}</h3>
                <p>${p.price} FCFA</p>
                <button onclick="addToCart(${i})">Ajouter</button>
                ${isAdmin ? `<p>ID:${i}</p>` : ""}
            </div>
        </div>`;
    });
}

// ================= PANIER =================
function addToCart(i){
    DB.cart.push(DB.menu[i]);
    save();
    renderCart();
}

function renderCart(){
    const el=document.getElementById("cart-items");
    el.innerHTML="";

    let total=0;

    DB.cart.forEach((item,i)=>{
        total+=item.price;

        el.innerHTML+=`
        <li>${item.name} - ${item.price}
        <button onclick="removeItem(${i})">❌</button></li>`;
    });

    el.innerHTML+=`<p>Total: ${total} FCFA</p>`;
}

function removeItem(i){
    DB.cart.splice(i,1);
    save();
    renderCart();
}

// ================= IA AMÉLIORÉE =================
function aiResponse(msg){

    msg=msg.toLowerCase();

    if(msg.includes("prix")) return "💰 3000 à 7000 FCFA";
    if(msg.includes("livraison")) return "🚚 Livraison disponible";
    if(msg.includes("recommande")) return randomPizza();
    if(msg.includes("boisson")) return "🥤 Coca / Fanta disponibles";
    if(msg.includes("bonjour")) return "👋 Bienvenue !";

    return "🤖 Je peux t'aider à choisir";
}

function randomPizza(){
    return "🍕 Essayez "+DB.menu[Math.floor(Math.random()*DB.menu.length)].name;
}

// ================= CHAT =================
function sendMessage(){
    const input=document.getElementById("chat-input");
    const msg=input.value;
    if(!msg) return;

    const res=aiResponse(msg);

    DB.chat.push({user:msg,ai:res});
    save();

    input.value="";
    renderChat();
}

function renderChat(){
    const box=document.getElementById("chat-box");
    box.innerHTML="";

    DB.chat.forEach(c=>{
        box.innerHTML+=`
        <p><b>Vous:</b> ${c.user}</p>
        <p><b>IA:</b> ${c.ai}</p>`;
    });
}

// ================= CONTACT =================
function savePhone(){
    if(!protect()) return;
    DB.contact.phone=document.getElementById("admin-phone").value;
    save(); renderContact();
}

function saveLocation(){
    if(!protect()) return;
    DB.contact.location=document.getElementById("admin-location").value;
    save(); renderContact();
}

function addSocial(){
    if(!protect()) return;

    const n=document.getElementById("social-name").value;
    const l=document.getElementById("social-link").value;

    DB.contact.socials.push({name:n,link:l});
    save();

    renderContact();
    renderAdminSocials();
}

function deleteSocial(i){
    if(!protect()) return;
    DB.contact.socials.splice(i,1);
    save();
    renderContact();
    renderAdminSocials();
}

function renderContact(){

    document.getElementById("phone").innerText =
        DB.contact.phone ? "📱 "+DB.contact.phone : "";

    document.getElementById("location").innerHTML =
        DB.contact.location ? `<a href="${DB.contact.location}" target="_blank">📍 Localisation</a>` : "";

    const el=document.getElementById("socials");
    el.innerHTML="";

    DB.contact.socials.forEach(s=>{
        el.innerHTML+=`<a href="${s.link}" target="_blank">${s.name}</a>`;
    });
}

function renderAdminSocials(){
    const el=document.getElementById("admin-socials");
    el.innerHTML="";

    DB.contact.socials.forEach((s,i)=>{
        el.innerHTML+=`
        <p>${s.name}
        <button onclick="deleteSocial(${i})">❌</button></p>`;
    });
}

// ================= BACKGROUND =================
function changeBg(){
    if(!protect()) return;

    const id=parseInt(document.getElementById("pizza-id").value);
    const bg=document.getElementById("pizza-bg").value;

    if(!DB.menu[id]) return alert("ID invalide");

    DB.menu[id].bg=bg;
    save();
    renderMenu();
}

// ================= PAIEMENT =================
function checkout(){
    if(!DB.cart.length) return alert("Panier vide");

    alert("Paiement simulé ✅");

    DB.cart=[];
    save();
    renderCart();
}

// ================= INIT =================
function init(){
    renderMenu();
    renderCart();
    renderChat();
    renderContact();
    renderAdminSocials();
}

document.addEventListener("DOMContentLoaded",init);

</script>


</body></html>
