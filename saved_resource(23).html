<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>MR PAPRIKA ULTRA PRO 🍕</title>

<style>
body { font-family: Arial; background:#020617; color:white; text-align:center; }
.container { max-width:1000px; margin:auto; }

.card {
    background:#0f172a;
    padding:15px;
    margin:15px;
    border-radius:15px;
}

button {
    padding:10px;
    margin:5px;
    border:none;
    background:#f97316;
    color:white;
    cursor:pointer;
}

input { padding:10px; width:70%; }

.toast {
    position:fixed;
    bottom:20px;
    right:20px;
    background:black;
    padding:10px;
}

</style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:#fff}html.dark{background-color:#212121}html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}</style></head>

<body>

<div class="container">

<h1>🍕 MR PAPRIKA ULTRA PRO</h1>

<!-- GEO -->
<div class="card">
<h3>📍 Localisation</h3>
<p id="location">Détection...</p>
</div>

<!-- MENU -->
<div class="card">
<h2>Menu IA</h2>
<button onclick="addToCart({name:&#39;Margherita&#39;,price:3000})">Margherita</button>
<button onclick="addToCart({name:&#39;Pepperoni&#39;,price:5000})">Pepperoni</button>
<button onclick="addToCart({name:&#39;Poulet&#39;,price:6000})">Poulet</button>
<button onclick="addToCart({name:&#39;Calzone&#39;,price:7000})">Calzone</button>
</div>

<!-- PANIER -->
<div class="card">
<h2>🛒 Panier</h2>
<ul id="cart-items">
        <li>Poulet - 6000
        <button onclick="removeItem(0)">❌</button></li>
        <li>Poulet - 6000
        <button onclick="removeItem(1)">❌</button></li><p>Total: 12000 FCFA</p></ul>
<button onclick="checkout()">💳 Payer</button>
</div>

<!-- CHAT -->
<div class="card">
<h2>🤖 IA Ultra</h2>
<div id="chat-box" style="height:200px;overflow:auto;"></div>
<input id="chat-input">
<button onclick="sendMessage()">Envoyer</button>
</div>

<!-- DASHBOARD -->
<div class="card">
<h2>📊 Business</h2>
<p id="stats">
    Commandes: 0<br>
    Revenus: 0 FCFA</p>
</div>

</div>

<script>
// ================= DATABASE =================
const DB = {
    cart: JSON.parse(localStorage.getItem("cart")||"[]"),
    orders: JSON.parse(localStorage.getItem("orders")||"[]"),
    chat: JSON.parse(localStorage.getItem("chat")||"[]"),
    user: JSON.parse(localStorage.getItem("user")||"{}")
};

function save(){ 
    localStorage.setItem("cart",JSON.stringify(DB.cart));
    localStorage.setItem("orders",JSON.stringify(DB.orders));
    localStorage.setItem("chat",JSON.stringify(DB.chat));
    localStorage.setItem("user",JSON.stringify(DB.user));
}

// ================= GEO =================
navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    DB.user.location = {lat, lon};
    save();

    document.getElementById("location").innerText =
        "📍 Position détectée ("+lat.toFixed(2)+","+lon.toFixed(2)+")";
});

// ================= PANIER =================
function addToCart(item){
    DB.cart.push(item);
    save();
    renderCart();
    showToast("Ajouté");
}

function renderCart(){
    const el = document.getElementById("cart-items");
    el.innerHTML="";

    let total=0;

    DB.cart.forEach((i,index)=>{
        total+=i.price;
        el.innerHTML+=`
        <li>${i.name} - ${i.price}
        <button onclick="removeItem(${index})">❌</button></li>`;
    });

    el.innerHTML+=`<p>Total: ${total} FCFA</p>`;
}

function removeItem(i){
    DB.cart.splice(i,1);
    save();
    renderCart();
}

// ================= IA ULTRA =================
function ai(msg){

    msg = msg.toLowerCase();

    const total = DB.cart.reduce((s,i)=>s+i.price,0);

    // compréhension avancée
    if(msg.includes("rapide") || msg.includes("vite")){
        return "⚡ Livraison express disponible !";
    }

    if(msg.includes("pas cher")){
        return "💰 Margherita est la moins chère (3000 FCFA)";
    }

    if(msg.includes("meilleur")){
        return "🔥 Pepperoni = best seller !";
    }

    if(msg.includes("livraison")){
        return deliveryEstimate();
    }

    if(msg.includes("recommande")){
        return smartAI();
    }

    // IA comportementale
    if(total > 10000){
        return "🔥 Grosse commande ! Livraison gratuite !";
    }

    return "🤖 Je peux optimiser ta commande et livraison";
}

// ================= IA SMART =================
function smartAI(){

    const history = DB.orders.flat();

    if(history.length > 10){
        return "⭐ Client VIP → Pizza premium recommandée !";
    }

    return ["Margherita","Pepperoni","Poulet","Calzone"]
    [Math.floor(Math.random()*4)];
}

// ================= LIVRAISON =================
function deliveryEstimate(){

    if(!DB.user.location){
        return "📍 Active ta localisation pour livraison";
    }

    return "🚚 Livraison estimée: 25-40 min à Abidjan";
}

// ================= CHAT =================
function sendMessage(){
    const input=document.getElementById("chat-input");
    const msg=input.value;

    if(!msg)return;

    const res=ai(msg);

    DB.chat.push({user:msg,ai:res});
    save();

    input.value="";
    renderChat();
}

function renderChat(){
    const box=document.getElementById("chat-box");
    box.innerHTML="";

    DB.chat.forEach(c=>{
        box.innerHTML+=`
        <p><b>Vous:</b> ${c.user}</p>
        <p><b>IA:</b> ${c.ai}</p>`;
    });

    box.scrollTop=box.scrollHeight;
}

// ================= PAIEMENT PRO =================
async function checkout(){

    if(!DB.cart.length) return alert("Panier vide");

    showToast("Connexion paiement...");

    await fakePayment();

    DB.orders.push([...DB.cart]);
    DB.cart=[];
    save();

    renderCart();
    updateStats();

    showToast("Paiement validé !");
}

// simulation API réelle
function fakePayment(){
    return new Promise(res=>{
        setTimeout(()=>res(true),2000);
    });
}

// ================= STATS =================
function updateStats(){

    const orders = DB.orders.length;
    const revenue = DB.orders.flat().reduce((s,i)=>s+i.price,0);

    document.getElementById("stats").innerHTML=`
    Commandes: ${orders}<br>
    Revenus: ${revenue} FCFA`;
}

// ================= MARKETING IA =================
setInterval(()=>{
    if(DB.cart.length === 0){
        showToast("🔥 Promo du jour !");
    }
    else if(DB.cart.length >= 2){
        showToast("🥤 Offre combo activée !");
    }
},12000);

// ================= UI =================
function showToast(msg){
    const t=document.createElement("div");
    t.className="toast";
    t.innerText=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

// ================= INIT =================
function init(){
    renderCart();
    renderChat();
    updateStats();
}

document.addEventListener("DOMContentLoaded",init);

</script>


<div class="toast">🥤 Offre combo activée !</div></body></html>
